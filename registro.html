<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ferretería</title>
    <link rel="stylesheet" href="registro.css">
</head>
<body>
    <div class="auth-container">
        <form id="form-registro" class="card">
            <h2>Crear Cuenta</h2>
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Juan Pérez">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña (Mín. 6 caracteres):</label>
                <input type="password" id="password" placeholder="******">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmar Contraseña:</label>
                <input type="password" id="confirm-password" placeholder="******">
            </div>
            <div id="error-msg" class="error-msg"></div>
            <button type="submit" class="btn-primary">Registrarse</button>
            <p class="mt-1">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </form>
    </div>

    <!-- Modal de Éxito -->
    <div id="modal-registro" class="modal">
        <div class="modal-content">
            <h3>¡Registro Exitoso!</h3>
            <p id="modal-texto"></p>
            <button id="btn-ir-login" class="btn-primary">Ir al Login</button>
        </div>
    </div>

    <script src="registro.js"></script>
</body>
</html>
