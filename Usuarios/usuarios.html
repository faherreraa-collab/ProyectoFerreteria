<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Ferretería</title>
    <link rel="stylesheet" href="usuarios.css">
    <link rel="stylesheet" href="../dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Menú Lateral Vertical -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>FerroStock</h2>
                <p class="user-role">Módulo Usuarios</p>
            </div>
            <nav class="sidebar-nav">
                <a href="../dashboard.html" class="nav-item">🏠 Inicio / Dashboard</a>
                <a href="../Productos/productos.html" class="nav-item">📦 Productos</a>
                <a href="../Inventario/inventario.html" class="nav-item">🏭 Inventario</a>
                <a href="../Despacho/despacho.html" class="nav-item">🚚 Despachos</a>
                <a href="../Servicios/servicios.html" class="nav-item">🛠️ Servicios</a>
                <a href="../Reporte/reporte.html" class="nav-item">📊 Reportes</a>
                <a href="usuarios.html" class="nav-item active">👥 Usuarios</a>
            </nav>
        </aside>

    <main class="container">
        <header class="top-bar">
                <h1>Gestión de Usuarios</h1>
            </header>
        <section class="card">
            <h2>Crear Nuevo Usuario</h2>
            <form id="form-usuario">
                <div class="form-group">
                    <label for="usr-nombre">Nombre Completo:</label>
                    <input type="text" id="usr-nombre" placeholder="Ej: Pedro Soto">
                </div>
                <div class="form-group">
                    <label for="usr-email">Correo Electrónico:</label>
                    <input type="email" id="usr-email" placeholder="pedro@ferre.cl">
                </div>
                <div class="form-group">
                    <label for="usr-rol">Rol asignado:</label>
                    <select id="usr-rol">
                        <option value="">-- Seleccionar Rol --</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Vendedor">Vendedor</option>
                        <option value="Bodeguero">Bodeguero</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="usr-pin">PIN de acceso (4 números):</label>
                    <input type="text" id="usr-pin" placeholder="1234">
                </div>
                <div id="error-msg" class="error-msg"></div>
                <button type="submit" class="btn-primary">Guardar Usuario</button>
            </form>
        </section>

        <section class="card mt-2">
            <h2>Lista de Usuarios</h2>
            <table id="tabla-usuarios">
                <thead>
                    <tr><th>Nombre</th><th>Email</th><th>Rol</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <div id="modal-usuario" class="modal">
        <div class="modal-content">
            <h3>Usuario Agregado</h3>
            <p id="modal-texto"></p>
            <button id="btn-cerrar-modal" class="btn-primary">Aceptar</button>
        </div>
    </div>

    <script src="usuarios.js"></script>
</body>
</html>
