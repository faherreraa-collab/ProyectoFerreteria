<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Despachos - Ferretería</title>
    <link rel="stylesheet" href="despacho.css">

    <link rel="stylesheet" href="../dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Menú Lateral Vertical -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>FerroStock</h2>
                <p class="user-role">Módulo Despachos</p>
            </div>
            <nav class="sidebar-nav">
                <a href="../dashboard.html" class="nav-item">🏠 Inicio / Dashboard</a>
                <a href="../Productos/productos.html" class="nav-item">📦 Productos</a>
                <a href="../Inventario/inventario.html" class="nav-item">🏭 Inventario</a>
                <a href="despacho.html" class="nav-item active">🚚 Despachos</a>
                <a href="../Servicios/servicios.html" class="nav-item">🛠️ Servicios</a>
                <a href="../Reporte/reporte.html" class="nav-item">📊 Reportes</a>
                <a href="../Usuarios/usuarios.html" class="nav-item">👥 Usuarios</a>
            </nav>
        </aside>

    <main class="container">
        <section class="card">
            <h2>Registrar Envío de Pedido</h2>
            <form id="form-despacho">
                <div class="form-group">
                    <label for="num-orden">Número de Orden (Min 4 caracteres):</label>
                    <input type="text" id="num-orden" placeholder="Ej: ORD-1001">
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección de Entrega:</label>
                    <input type="text" id="direccion" placeholder="Ej: Av. Principal 123">
                </div>

                <div class="form-group">
                    <label for="comuna">Comuna / Región:</label>
                    <select id="comuna">
                        <option value="">-- Seleccione Comuna --</option>
                        <option value="Santiago">Santiago</option>
                        <option value="Maipú">Maipú</option>
                        <option value="San Bernardo">San Bernardo</option>
                        <option value="Providencia">Providencia</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha-despacho">Fecha Programada:</label>
                    <input type="date" id="fecha-despacho">
                </div>

                <div id="error-msg" class="error-msg"></div>
                <button type="submit" class="btn-primary">Registrar Despacho</button>
            </form>
        </section>

        <section class="card mt-2">
            <h2>Despachos Registrados</h2>
            <table id="tabla-despachos">
                <thead>
                    <tr>
                        <th>N° Orden</th>
                        <th>Dirección</th>
                        <th>Comuna</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Se llena dinámicamente -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Modal de Confirmación -->
    <div id="modal-confirmacion" class="modal">
        <div class="modal-content">
            <h3>¡Despacho Registrado!</h3>
            <p id="modal-texto"></p>
            <button id="btn-cerrar-modal" class="btn-primary">Aceptar</button>
        </div>
    </div>

    <script src="despacho.js"></script>

</body>
</html>
