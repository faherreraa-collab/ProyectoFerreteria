<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ferretería</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="auth-container">
        <form id="form-login" class="card">
            <h2>Iniciar Sesión</h2>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="admin@ferre.cl">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="******">
            </div>
            <div id="error-msg" class="error-msg"></div>
            <button type="submit" class="btn-primary">Ingresar</button>
            <p class="mt-1">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </form>
    </div>

    <!-- Modal de Bienvenido -->
    <div id="modal-login" class="modal">
        <div class="modal-content">
            <h3>¡Bienvenido/a!</h3>
            <p id="modal-texto"></p>
            <button id="btn-entrar" class="btn-primary">Ir al Dashboard</button>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
